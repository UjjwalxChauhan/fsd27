<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="random()" >Click</button>
    <p id="num"></p>
    <script>
        function random(){
        document.getElementById("num").innerHTML=Math.floor(Math.random()*100);
        }
    </script>
</body>
</html>
