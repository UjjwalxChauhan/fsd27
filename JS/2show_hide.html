<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="text">Hello Bro</p>
    <button onclick="toggletext()"> Show/Hide </button>
    <script>
        function toggletext(){
            let t=document.getElementById("text");
            if(t.style.display ==="none"){ // check hidden hai ki nahi
                t.style.display = "block"; // if not then hidden
            }
            else{
                t.style.display = "none";
            }
        }
    </script>
</body>

</html>
